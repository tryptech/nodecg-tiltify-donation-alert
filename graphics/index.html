<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            margin: 0px;
        }

        .monospace {
            font-family: monospace;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenLite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TimelineLite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/easing/EasePack.min.js"></script>

    <script src="./alert.js"></script>

</head>

<body>
    <script>
        $(function() {
            var stageElement = document.createElement('canvas');
            stageElement.id = 'alert';
            stageElement.width = window.innerWidth;
            stageElement.height = 100;
            document.body.appendChild(stageElement);
            var stage = new createjs.Stage('alert');
            createjs.Ticker.framerate = 60;
            createjs.Ticker.timingMode = createjs.Ticker.RAF_SYNCED;
            createjs.Ticker.addEventListener('tick', event => {
                stage.update();
            });
            const alert = new Alert(window.innerWidth, 50);

            stage.addChild(alert.container);

            var donationsRep = nodecg.Replicant("donations", "nodecg-tiltify");
            var trackedCampaignIdRep = nodecg.Replicant("trackedCampaignId", "nodecg-tiltify");

            donationsRep.on("change", function(newvalue, oldvalue) {
                // Skip the initial replicant dump so reloading the graphic
                // does not replay the entire donation backlog.
                if (!newvalue || !oldvalue) {
                    return;
                }

                var previousIds = {};
                for (let i = 0; i < oldvalue.length; i++) {
                    previousIds[oldvalue[i].id] = true;
                }

                var currentCampaignId = trackedCampaignIdRep.value;
                for (let i = 0; i < newvalue.length; i++) {
                    var donation = newvalue[i];
                    if (donation.shown || previousIds[donation.id]) {
                        continue;
                    }
                    if (currentCampaignId && donation.campaign_id !== currentCampaignId) {
                        continue;
                    }
                    alert.notify(`${donation.donor_name} Donated $${donation.amount.value}`, donation);
                    nodecg.sendMessageToBundle('set-donation-shown', 'nodecg-tiltify', [donation, true]);
                }
            });

        });
    </script>
</body>

</html>
